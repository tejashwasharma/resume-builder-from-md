<meta charset="utf-8">
<title>The Interview Book</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/*{{CSS}}*/
</style>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <a class="brand" id="go-home" href="#">
      <span class="brand-title">The Interview Book</span>
      <span class="brand-sub" id="brand-sub">Your path</span>
    </a>
    <div class="search">
      <label class="sr-only" for="search">Search the book</label>
      <input id="search" type="search" placeholder="Search the book" autocomplete="off">
    </div>
    <nav id="nav" aria-label="Topics and chapters"></nav>
    <div class="sidebar-foot">
      <button class="ghost small" id="theme" type="button" title="Switch light / dark / system">Theme</button>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="topbar">
      <button class="ghost menu-btn" id="menu" type="button" aria-label="Open topics">☰</button>
      <span class="topbar-title" id="topbar-title"></span>
    </div>
    <div id="view"></div>
  </main>
</div>

<button class="ask-fab" id="ask-fab" type="button" hidden title="Ask the book (/)">Ask</button>

<div class="ask-panel" id="ask-panel" hidden>
  <div class="ask-head">
    <div>
      <div class="t">Ask the book</div>
      <div class="s" id="ask-ctx">Answers come from these chapters</div>
    </div>
    <button id="ask-close" type="button" title="Close">×</button>
  </div>
  <div class="ask-log" id="ask-log"></div>
  <div class="ask-foot">
    <label class="sr-only" for="ask-input">Your question</label>
    <textarea id="ask-input" rows="1" placeholder="Ask about this chapter, or anything in the book"></textarea>
    <button class="primary" id="ask-send" type="button">Ask</button>
  </div>
</div>
